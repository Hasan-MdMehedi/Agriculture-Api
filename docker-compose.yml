version: "3.9"

services:
  api:
    build: .
    ports:
      - "5000:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-agriculture_db}
    env_file:
      - .env
    restart: unless-stopped
